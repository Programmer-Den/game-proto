name: Issue labels

# Adds the game label to issues filed through the forms in .github/ISSUE_TEMPLATE,
# from the answer to their Game dropdown. The forms set the type label themselves.
# Then it adds the issue to "All feedback" and that game's Project with the status
# Todo, and takes it off the old game's Project when the dropdown changed, using
# PROJECTS_TOKEN (a classic token with only the "project" scope): the Projects'
# built-in Auto-add misses labels added by this workflow's own token.
# Run it by hand with an issue number to file an older issue again.
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: read
  issues: write

jobs:
  game-label:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PROJECTS_TOKEN != '' }}
    steps:
      - name: Label the issue with its game
        id: label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            // Dropdown option -> game label. Keep in step with the forms and .github/labels.json.
            const games = {"Apothecary": "apothecary", "Deadline": "deadline", "Palisade": "palisade", "Tiny Kingdom": "tiny-kingdom", "Hotfoot": "hotfoot", "Anvilheart": "anvilheart", "Broadside": "broadside", "TinctureTinker": "tincture-tinker", "Catacomb": "catacomb", "Golem Garden": "golem-garden", "Beehive Baron": "beehive-baron", "Wyrmrail": "wyrmrail", "Shrine Stack": "shrine-stack", "Mapmaker": "mapmaker", "Lanternkeep": "lanternkeep", "Space Wars": "space-wars", "Lane Brawl": "lane-brawl", "Colonizer": "colonizer", "Riftblade": "riftblade", "Scrapyard Titans": "scrapyard-titans", "Bramblecrest": "bramblecrest", "Ninefold": "ninefold", "Augury": "augury", "Mazewright": "mazewright", "Hub page": "hub", "Shared / all games": "shared"};
            // The body is read as data from the event; it never reaches a shell.
            const issue = context.payload.issue
              || (await github.rest.issues.get({ ...context.repo, issue_number: Number(process.env.ISSUE) })).data;
            const match = /^### Game\s*\r?\n\s*\r?\n(.+)$/m.exec(issue.body || '');
            const label = match && games[match[1].trim()];
            if (!label) {
              console.log('No game picked in the form; nothing to do.');
              return;
            }
            core.setOutput('label', label);
            core.setOutput('node_id', issue.node_id);
            core.setOutput('number', issue.number);
            const gameLabels = new Set(Object.values(games));
            const stale = issue.labels.map(l => l.name).filter(n => gameLabels.has(n) && n !== label);
            core.setOutput('stale', JSON.stringify(stale));
            for (const name of stale) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [label] });
            console.log(`Labelled #${issue.number} with ${label}`);
      - if: steps.label.outputs.label && env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/projects.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Add the issue to its Projects
        if: steps.label.outputs.label && env.HAS_TOKEN == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LABEL: ${{ steps.label.outputs.label }}
          NODE_ID: ${{ steps.label.outputs.node_id }}
          NUMBER: ${{ steps.label.outputs.number }}
          STALE: ${{ steps.label.outputs.stale }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const wanted = JSON.parse(require('fs').readFileSync('.github/projects.json', 'utf8'));
            const titles = new Set(wanted.filter(p => p.label === null || p.label === process.env.LABEL).map(p => p.title));
            const issue = { node_id: process.env.NODE_ID, number: process.env.NUMBER };
            // The Projects of the game labels just taken off (the Game dropdown changed).
            const stale = JSON.parse(process.env.STALE || '[]');
            const staleTitles = new Set(wanted.filter(p => p.label !== null && stale.includes(p.label)).map(p => p.title));

            const { user } = await github.graphql(`
              query($owner: String!) {
                user(login: $owner) {
                  projectsV2(first: 100) {
                    nodes {
                      id title
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField { id options { id name } }
                      }
                    }
                  }
                }
              }`, { owner: context.repo.owner });

            for (const project of user.projectsV2.nodes.filter(p => titles.has(p.title))) {
              // Adding an issue that is already in the Project returns its existing item.
              const { addProjectV2ItemById: { item } } = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id isArchived fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } }
                  }
                }`, { projectId: project.id, contentId: issue.node_id });
              // Adding an archived item returns it still archived, so bring it back.
              if (item.isArchived) {
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!) {
                    unarchiveProjectV2Item(input: { projectId: $projectId, itemId: $itemId }) { item { id } }
                  }`, { projectId: project.id, itemId: item.id });
                console.log(`Unarchived #${issue.number} in ${project.title}`);
              }
              console.log(`Added #${issue.number} to ${project.title}`);
              // Give it Todo only when it has no status yet, so a status set by hand stays.
              const todo = project.field?.options.find(o => o.name.toLowerCase() === 'todo');
              if (!todo || item.fieldValueByName) continue;
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }`, { projectId: project.id, itemId: item.id, fieldId: project.field.id, optionId: todo.id });
            }

            // Take the issue off the old game's Project, since its built-in workflows never remove it.
            if (staleTitles.size) {
              const { node } = await github.graphql(`
                query($id: ID!) {
                  node(id: $id) {
                    ... on Issue { projectItems(first: 50, includeArchived: true) { nodes { id project { id title } } } }
                  }
                }`, { id: issue.node_id });
              for (const item of node.projectItems.nodes.filter(i => staleTitles.has(i.project.title))) {
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!) {
                    deleteProjectV2Item(input: { projectId: $projectId, itemId: $itemId }) { deletedItemId }
                  }`, { projectId: item.project.id, itemId: item.id });
                console.log(`Removed #${issue.number} from ${item.project.title}`);
              }
            }
