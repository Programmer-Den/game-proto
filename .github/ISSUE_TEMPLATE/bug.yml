name: Bug report
description: Something is broken, crashes, shows an error, or runs slowly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: Which game is this about?
      options:
        - Apothecary
        - Deadline
        - Palisade
        - Tiny Kingdom
        - Hotfoot
        - Anvilheart
        - Broadside
        - TinctureTinker
        - Catacomb
        - Golem Garden
        - Beehive Baron
        - Wyrmrail
        - Shrine Stack
        - Mapmaker
        - Lanternkeep
        - Space Wars
        - Lane Brawl
        - Colonizer
        - Riftblade
        - Scrapyard Titans
        - Bramblecrest
        - Ninefold
        - Augury
        - Mazewright
        - Hub page
        - Shared / all games
      # Preselect Shared, so a report never lands on a game by accident.
      default: 25
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the game
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows, Safari on iPhone
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Drag files here if you have any.
