<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Game hub</title>
    <link rel="icon" type="image/svg+xml" href="__OLD_HOME__favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1b1410;
        color: #f3e6d4;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: max(48px, env(safe-area-inset-top)) 16px 32px;
        text-align: center;
      }
      main[hidden] {
        display: none;
      }
      img {
        width: 64px;
        height: 64px;
      }
      a.open,
      button {
        display: inline-block;
        margin: 8px 4px;
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #e37100;
        color: #1b1410;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: #3a2c22;
        color: #f3e6d4;
      }
    </style>
  </head>
  <body>
    <main hidden>
      <img src="__OLD_HOME__favicon.svg" alt="" />
      <h1 data-text="title"></h1>
      <p class="lede"></p>
      <p><a class="open" target="_blank" rel="noopener" data-text="open"></a></p>
      <p><button type="button" class="copy" data-text="copy"></button></p>
    </main>
    <script>
      // The game hub moved to a new address. This page answers every address of the old one (it is
      // also the 404 page) and sends the player on to the same page at the new address, taking the
      // saves kept here along: they live in the browser under this address, so the new one can't
      // read them. The new address's move.html takes them in (shared/move.ts in the game-proto repo,
      // which describes the format). Made by scripts/move-site.mjs, which fills in the values below.
      var NEW_HOME = '__NEW_HOME__';
      var OLD_HOME = '__OLD_HOME__';
      var GAMES = __GAMES__;
      // The progress files' key text (shared/saveFile.ts) and what seals a move to it.
      var KEY_TEXT = 'game-proto progress file, v1';
      var SEAL = 'game-proto move';
      // Longer links than this may not open in every browser, so saved replays and a run under
      // way are left behind, as progress codes do, and with still too much nothing is carried.
      var MAX_LINK = 1500000;

      var TEXTS = {
        en: {
          title: 'The game hub has moved',
          tab: 'Taking you to its new address with your progress…',
          app: 'This app now lives at a new address. Open it there to take your progress along, then install the app again from there and remove this one.',
          offline: 'You are offline. Connect to the internet to move to the new address with your progress.',
          open: 'Open the new address',
          copy: 'Copy link',
          copied: 'Link copied',
        },
        de: {
          title: 'Die Spielesammlung ist umgezogen',
          tab: 'Du wirst mit deinem Fortschritt zur neuen Adresse gebracht …',
          app: 'Diese App ist unter einer neuen Adresse zu finden. Öffne sie dort, um deinen Fortschritt mitzunehmen, installiere die App von dort neu und entferne diese.',
          offline: 'Du bist offline. Verbinde dich mit dem Internet, um mit deinem Fortschritt zur neuen Adresse umzuziehen.',
          open: 'Neue Adresse öffnen',
          copy: 'Link kopieren',
          copied: 'Link kopiert',
        },
      };

      function storage() {
        try {
          return window.localStorage;
        } catch (e) {
          return null;
        }
      }

      var text = TEXTS.en;
      try {
        var language = JSON.parse(storage().getItem('hub-settings') || '{}').language;
        if (language === 'de') text = TEXTS.de;
        document.documentElement.lang = language || 'en';
      } catch (e) {
        // No settings: British English.
      }

      function belongs(key) {
        if (key.indexOf('hub-') === 0) return true;
        return GAMES.some(function (g) {
          return key === g || key.indexOf(g + '-') === 0;
        });
      }

      // The saves of the hub and the games, without saved replays and runs under way unless `all`.
      function oldSaves(all) {
        var data = {};
        var store = storage();
        if (!store) return data;
        for (var i = 0; i < store.length; i++) {
          var key = store.key(i);
          if (!belongs(key) || (!all && /-(replays|run)$/.test(key))) continue;
          data[key] = store.getItem(key);
        }
        return data;
      }

      // Where the player was headed, relative to the hub: the same path, query and hash.
      var path = location.pathname.indexOf(OLD_HOME) === 0 ? location.pathname.slice(OLD_HOME.length) : '';
      var target = path.replace(/(^|\/)index\.html$/, '$1') + location.search + location.hash;

      function bytes(s) {
        return new TextEncoder().encode(s);
      }

      async function seal(payload) {
        var raw = await crypto.subtle.digest('SHA-256', bytes(KEY_TEXT));
        var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
        var plain = bytes(JSON.stringify(payload));
        var format = 0;
        if (window.CompressionStream) {
          var stream = new Blob([plain]).stream().pipeThrough(new CompressionStream('deflate-raw'));
          plain = new Uint8Array(await new Response(stream).arrayBuffer());
          format = 1;
        }
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var seal = bytes(SEAL);
        var additionalData = new Uint8Array(seal.length + 1);
        additionalData.set(seal);
        additionalData[seal.length] = format;
        var sealed = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: additionalData }, key, plain));
        var out = new Uint8Array(13 + sealed.length);
        out[0] = format;
        out.set(iv, 1);
        out.set(sealed, 13);
        var binary = '';
        for (var i = 0; i < out.length; i += 0x8000) binary += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      // The new address with the saves in it, or without them when there are none or they can't go.
      async function moveLink() {
        var plain = NEW_HOME + target;
        try {
          for (var all of [true, false]) {
            var data = oldSaves(all);
            if (!Object.keys(data).length) return plain;
            var link = NEW_HOME + 'move.html#move=' + (await seal({ to: target, data: data }));
            if (link.length <= MAX_LINK) return link;
          }
        } catch (e) {
          // No WebCrypto here, so only the address moves.
        }
        return plain;
      }

      var installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

      function show(lede, link) {
        var main = document.querySelector('main');
        main.querySelectorAll('[data-text]').forEach(function (el) {
          el.textContent = text[el.dataset.text];
        });
        main.querySelector('.lede').textContent = lede;
        var open = main.querySelector('.open');
        open.href = link;
        // In a browser tab, the link opens in the same tab.
        if (!installed) open.removeAttribute('target');
        var copy = main.querySelector('.copy');
        copy.hidden = !navigator.clipboard;
        copy.addEventListener('click', function () {
          navigator.clipboard.writeText(link).then(function () {
            copy.textContent = text.copied;
          });
        });
        main.hidden = false;
      }

      moveLink().then(function (link) {
        // The installed app keeps its own saves on some phones and stays bound to this address, so
        // the player opens the new one in the browser, saves and all, and installs it again there.
        if (installed) show(text.app, link);
        else if (navigator.onLine === false) show(text.offline, link);
        else {
          show(text.tab, link);
          location.replace(link);
        }
      });
    </script>
  </body>
</html>
